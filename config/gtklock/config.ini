# Corebrum lock screen. System-owned. It is not copied into a home directory.
[main]
modules=/usr/local/lib/corebrum/libcorebrum-glitch.so
background=/usr/share/hypr/wall2.png
style=/etc/corebrum/gtklock/style.css
layout=/etc/corebrum/gtklock/layout.ui
time-format=%H:%M
date-format=%A, %d %B %Y
follow-focus=true
