# Managed by Corebrum OS. A previous file is backed up under /var/log/corebrum/backups.
# VT 7 is the greeter. VT 1 remains a text console.
# corebrum-greetd runs cage -s -d. cage exits when gtkgreet exits.
# greetd then starts the user session. On a Raspberry Pi the wrapper selects
# the vc4 HDMI device. x86_64 has no vc4 device, so cage is unchanged.

[terminal]
vt = 7

[default_session]
command = "/usr/local/bin/corebrum-greetd"
user = "_greetd"
