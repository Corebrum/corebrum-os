# Ubuntu 24.04 lock screen. gtklock 2.1 cannot lock Sway 1.9.
# The ring is the control. The account password unlocks it.
ignore-empty-password
scaling=fill
image=/usr/share/hypr/wall2.png
indicator-radius=100
indicator-thickness=12
inside-color=00000000
inside-clear-color=00000000
inside-caps-lock-color=00000000
inside-ver-color=00000000
inside-wrong-color=00000000
ring-color=3d9a8b
ring-clear-color=3d9a8b
ring-caps-lock-color=3d9a8b
ring-ver-color=3d9a8b
ring-wrong-color=c45c4a
key-hl-color=3d9a8b
separator-color=00000000
text-color=ffffff
line-color=00000000
line-clear-color=00000000
line-caps-lock-color=00000000
line-ver-color=00000000
line-wrong-color=00000000
