# Corebrum lock screen. System-owned. It is not copied into a home directory.
# hyprlock 0.9.2. Super+Escape starts it through corebrum-lock.

$font = Monospace

general {
    hide_cursor = true
    immediate_render = true
}

background {
    monitor =
    path = /usr/share/hypr/wall2.png
    blur_passes = 0
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0)
    outer_color = rgba(3d9a8bee)
    check_color = rgba(3d9a8bee)
    fail_color = rgba(ff6633ee)
    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    rounding = 15
    font_family = $font
    placeholder_text = Password
    fail_text = $PAMFAIL
    dots_spacing = 0.3
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = $font
    position = -30, 0
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 25
    font_family = $font
    position = -30, -150
    halign = right
    valign = top
}
