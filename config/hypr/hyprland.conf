# Corebrum Hyprland session. Dwindle is the default layout.
# Hyprlang syntax for Hyprland 0.56. The global dwindle:pseudotile option was removed in 0.55.
# System-owned. It is not copied into a home directory.

monitor=,preferred,auto,1

env = XCURSOR_THEME,DMZ-White
env = XCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland
env = GDK_BACKEND,wayland,x11
env = XDG_SESSION_TYPE,wayland

$mainMod = SUPER

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(3d9a8bee)
    col.inactive_border = rgba(3a3a3aaa)
    layout = dwindle
}

dwindle {
    preserve_split = true
}

decoration {
    rounding = 6
}

animations {
    enabled = true
}

# Hyprland's splash quotes are compiled in. The bottom Waybar draws the tagline instead.
misc {
    disable_splash_rendering = true
}

input {
    kb_layout = us
    follow_mouse = 1
}

bind = $mainMod, Return, exec, /usr/local/bin/corebrum-terminal
bind = $mainMod SHIFT, Return, exec, firefox
bind = $mainMod, W, killactive
bind = $mainMod, F, fullscreen
bind = $mainMod, V, togglefloating
bind = $mainMod, Space, exec, /usr/local/bin/corebrum-launcher
bind = $mainMod ALT, Space, exec, /usr/local/bin/corebrum-grid
bind = $mainMod, S, togglespecialworkspace, agent
bind = $mainMod, Escape, exec, /usr/local/bin/corebrum-lock
bind = $mainMod SHIFT, E, exit

bind = , Print, exec, sh -c 'geom="$(slurp)" || exit 0; grim -g "$geom" - | wl-copy'
bind = SHIFT, Print, exec, sh -c 'grim - | wl-copy'
bind = $mainMod, Print, exec, sh -c 'geom="$(slurp)" || exit 0; mkdir -p "$HOME/Videos"; wf-recorder -g "$geom" -f "$HOME/Videos/corebrum-$(date +%Y%m%d-%H%M%S).mp4"'
bind = $mainMod SHIFT, Print, exec, sh -c 'pkill -INT wf-recorder'
bind = $mainMod, C, exec, sh -c 'cliphist list | wofi --dmenu --conf /etc/corebrum/wofi/config --style /etc/corebrum/wofi/style.css --prompt Clipboard | cliphist decode | wl-copy'

bind = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bind = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

workspace = special:agent, on-created-empty:/usr/local/bin/corebrum-terminal

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
# Waybar 0.9 reads /tmp/hypr. Hyprland 0.56 keeps the socket under XDG_RUNTIME_DIR.
exec-once = sh -c 'mkdir -p /tmp/hypr && ln -sfn "$XDG_RUNTIME_DIR/hypr/$HYPRLAND_INSTANCE_SIGNATURE" "/tmp/hypr/$HYPRLAND_INSTANCE_SIGNATURE"'
exec-once = /usr/libexec/polkit-mate-authentication-agent-1
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = systemctl --user start thunar.service
exec-once = wl-paste --watch cliphist store
# Waypaper writes this config when the user saves a wallpaper. Do not create it here.
exec-once = sh -c 'bin="$HOME/.local/bin/waypaper"; cfg="$HOME/.config/waypaper/config.ini"; [ -x "$bin" ] && [ -f "$cfg" ] && exec "$bin" --restore'
exec-once = waybar --config /etc/corebrum/waybar/config.json --style /etc/corebrum/waybar/style.css
exec-once = mako --config /etc/corebrum/mako/config
