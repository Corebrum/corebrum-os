# Corebrum Hyprland session. Dwindle is the default layout.
# Hyprlang syntax for Hyprland 0.56. The global dwindle:pseudotile option was removed in 0.55.
# System-owned. It is not copied into a home directory.

monitor=,preferred,auto,1

env = XCURSOR_THEME,DMZ-White
env = XCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland
env = GDK_BACKEND,wayland,x11
env = XDG_SESSION_TYPE,wayland

$mainMod = SUPER

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(3d9a8bee)
    col.inactive_border = rgba(3a3a3aaa)
    layout = dwindle
}

dwindle {
    preserve_split = true
}

decoration {
    rounding = 6
}

animations {
    enabled = true
}

# Hyprland's splash quotes are compiled in. The bottom Waybar draws the tagline instead.
misc {
    disable_splash_rendering = true
}

input {
    kb_layout = us
    follow_mouse = 1
}

bind = $mainMod, Return, exec, /usr/local/bin/corebrum-terminal
bind = $mainMod SHIFT, Return, exec, firefox
bind = $mainMod SHIFT, F, exec, thunar
bind = $mainMod SHIFT, N, exec, gnome-text-editor
bind = $mainMod, W, killactive
bind = $mainMod, F, fullscreen
bind = $mainMod, T, togglefloating
bind = $mainMod, C, exec, /usr/local/bin/corebrum-edit-keys copy
bind = $mainMod, X, exec, /usr/local/bin/corebrum-edit-keys cut
bind = $mainMod, V, exec, /usr/local/bin/corebrum-edit-keys paste
bind = $mainMod, Space, exec, /usr/local/bin/corebrum-launcher
bind = $mainMod ALT, Space, exec, /usr/local/bin/corebrum-grid
bind = $mainMod, S, togglespecialworkspace, agent
bind = $mainMod, Escape, exec, /usr/local/bin/corebrum-lock
bind = $mainMod SHIFT, Escape, exec, /usr/local/bin/corebrum-autolock toggle
bind = $mainMod SHIFT, E, exit

bind = , Print, exec, sh -c 'geom="$(slurp)" || exit 0; grim -g "$geom" - | wl-copy'
bind = SHIFT, Print, exec, sh -c 'grim - | wl-copy'
bind = $mainMod, Print, exec, /usr/local/bin/corebrum-record start
bind = $mainMod SHIFT, Print, exec, /usr/local/bin/corebrum-record stop
bind = $mainMod, P, exec, sh -c 'geom="$(slurp)" || exit 0; grim -g "$geom" - | wl-copy'
bind = $mainMod SHIFT, P, exec, sh -c 'grim - | wl-copy'
bind = $mainMod ALT, P, exec, /usr/local/bin/corebrum-record start
bind = $mainMod ALT SHIFT, P, exec, /usr/local/bin/corebrum-record stop
bind = $mainMod SHIFT, C, exec, sh -c 'cliphist list | wofi --dmenu --conf /etc/corebrum/wofi/config --style /etc/corebrum/wofi/style.css --prompt Clipboard | cliphist decode | wl-copy'

bind = , XF86AudioRaiseVolume, exec, /usr/local/bin/corebrum-osd volume-up
bind = , XF86AudioLowerVolume, exec, /usr/local/bin/corebrum-osd volume-down
bind = , XF86AudioMute, exec, /usr/local/bin/corebrum-osd volume-mute
bind = , XF86AudioMicMute, exec, /usr/local/bin/corebrum-osd mic-mute
bind = , XF86MonBrightnessUp, exec, /usr/local/bin/corebrum-osd brightness-up
bind = , XF86MonBrightnessDown, exec, /usr/local/bin/corebrum-osd brightness-down

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bind = $mainMod SHIFT, left, swapwindow, l
bind = $mainMod SHIFT, right, swapwindow, r
bind = $mainMod SHIFT, up, swapwindow, u
bind = $mainMod SHIFT, down, swapwindow, d
bind = $mainMod SHIFT, H, swapwindow, l
bind = $mainMod SHIFT, L, swapwindow, r
bind = $mainMod SHIFT, K, swapwindow, u
bind = $mainMod SHIFT, J, swapwindow, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

windowrule {
    name = corebrum-launcher
    match:class = ^(corebrum-launcher)$
    float = true
    center = true
    size = 680 460
}

windowrule {
    name = corebrum-setup
    match:class = ^(corebrum-setup)$
    float = true
    center = true
    size = 900 640
}

windowrule {
    name = corebrum-camera
    match:class = ^(corebrum-camera)$
    float = true
    pin = true
    no_focus = true
    border_size = 0
    size = 320 180
}

workspace = special:agent, on-created-empty:/usr/local/bin/corebrum-terminal

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
# Waybar 0.9 reads /tmp/hypr. Hyprland 0.56 keeps the socket under XDG_RUNTIME_DIR.
exec-once = sh -c 'mkdir -p /tmp/hypr && ln -sfn "$XDG_RUNTIME_DIR/hypr/$HYPRLAND_INSTANCE_SIGNATURE" "/tmp/hypr/$HYPRLAND_INSTANCE_SIGNATURE"'
exec-once = /usr/libexec/polkit-mate-authentication-agent-1
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = systemctl --user start thunar.service
exec-once = wl-paste --watch cliphist store
# The wallpaper menu writes this config when the user picks an image. Do not create it here.
exec-once = sh -c 'cmd=$(command -v hyprpaper); cfg="${XDG_STATE_HOME:-$HOME/.local/state}/corebrum/hyprpaper.conf"; [ -n "$cmd" ] && [ -f "$cfg" ] && exec "$cmd" --config "$cfg"'
exec-once = waybar --config /etc/corebrum/waybar/config.json --style /etc/corebrum/waybar/style.css
exec-once = mako --config /etc/corebrum/mako/config
# Weekly reminder. This does not run apt or git. The pause lets Mako start first.
exec-once = sh -c 'sleep 2; exec /usr/local/bin/corebrum-updates-menu remind'
exec-once = /usr/local/bin/corebrum-autolock start
# First graphical login. RealSense and AgenticROS need ROS 2, so the wizard
# offers them in that order. When ROS 2, RealSense, AgenticROS, and every AI
# agent are already installed, this writes
# ${XDG_STATE_HOME:-~/.local/state}/corebrum/setup-done and stays closed.
# Skip and Exit are on every step. Exit writes that marker, and later logins
# do not open the wizard.
exec-once = /usr/local/bin/corebrum-setup login
