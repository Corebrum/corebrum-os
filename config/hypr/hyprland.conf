# Corebrum Hyprland session. Dwindle is the default layout.
# Hyprlang syntax for Hyprland 0.56. The global dwindle:pseudotile option was removed in 0.55.
# System-owned. It is not copied into a home directory.

monitor=,preferred,auto,1

env = XCURSOR_THEME,DMZ-White
env = XCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland
env = GDK_BACKEND,wayland,x11

$mainMod = SUPER

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(3d9a8bee)
    col.inactive_border = rgba(3a3a3aaa)
    layout = dwindle
}

dwindle {
    preserve_split = true
}

decoration {
    rounding = 6
}

animations {
    enabled = true
}

input {
    kb_layout = us
    follow_mouse = 1
}

bind = $mainMod, Return, exec, /usr/local/bin/corebrum-terminal
bind = $mainMod, Q, killactive
bind = $mainMod, F, fullscreen
bind = $mainMod, V, togglefloating
bind = $mainMod, Space, exec, fuzzel --config /etc/corebrum/fuzzel/fuzzel.ini
bind = $mainMod ALT, Space, exec, /usr/local/bin/corebrum-grid
bind = $mainMod, S, togglespecialworkspace, agent
bind = $mainMod SHIFT, E, exit

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

workspace = special:agent, on-created-empty:/usr/local/bin/corebrum-terminal

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = waybar --config /etc/corebrum/waybar/config.json --style /etc/corebrum/waybar/style.css
exec-once = mako --config /etc/corebrum/mako/config
