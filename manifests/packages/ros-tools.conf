# ROS tools for the Super+Space menu. One tool per line:
# id|Label|package-suffix|launch command
# The apt package is ros-<distro>-<package-suffix>.
# Distro is jazzy on noble and lyrical on resolute.
# Checked against packages.ros.org on 2026-10-22.
# These packages are not installed by corebrum install ros.
# RViz renders with GLX. On this Wayland session Qt would otherwise pick a
# Wayland window, and Ogre then aborts while creating that child window.
# XWayland is already installed. QT_QPA_PLATFORM=xcb sends Qt through it.
# Nav2 starts RViz, so it uses the same setting. Gazebo's GUI is Qt and its
# scene is Ogre GLX, so it needs that XWayland path too.
rviz|RViz|rviz2|env QT_QPA_PLATFORM=xcb rviz2
gazebo|Gazebo|ros-gz|env QT_QPA_PLATFORM=xcb ros2 launch ros_gz_sim gz_sim.launch.py gz_args:=empty.sdf
nav2|Nav2|nav2-bringup|env QT_QPA_PLATFORM=xcb ros2 launch nav2_bringup tb3_simulation_launch.py headless:=False
moveit|MoveIt|moveit|ros2 launch moveit_setup_assistant setup_assistant.launch.py
