# AI agent CLIs for the Super+Space menu. One agent per line:
# id^Label^binary^kind^install^launch
# kind script runs the install command as the logged-in user.
# kind npm installs that package with the system npm, which is root-owned.
# Checked on 2026-10-22. These are not installed by the desktop profile.
# Grok's shell installer also links an `agent` command over Cursor CLI.
# The npm package @xai-official/grok provides `grok` only.
antigravity^Antigravity CLI^agy^script^curl -fsSL https://antigravity.google/cli/install.sh | bash^agy
claude^Claude Code CLI^claude^script^curl -fsSL https://claude.ai/install.sh | bash^claude
codex^Codex CLI^codex^script^curl -fsSL https://chatgpt.com/codex/install.sh | sh^codex
cursor^Cursor CLI^agent^script^curl -fsS https://cursor.com/install | bash^agent
grok^Grok CLI^grok^npm^@xai-official/grok^grok
hermes^Hermes CLI^hermes^script^curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash^hermes
openclaw^OpenClaw^openclaw^npm^openclaw@latest^openclaw
